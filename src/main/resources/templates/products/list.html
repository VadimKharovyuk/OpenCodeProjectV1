<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товары — OpenCodeProject</title>
    <meta name="description" content="Каталог товаров OpenCodeProject.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container page">
    <div class="page__head">
        <div>
            <p class="eyebrow">Каталог</p>
            <h1 class="display display--compact">Товары.</h1>
            <p class="lede">Всё, что есть в базе. Откройте карточку, чтобы посмотреть описание, цену и наличие.</p>
        </div>
        <a class="button" th:href="@{/admin/products/new}">Добавить товар</a>
    </div>

    <div class="product-grid" th:if="${!products.isEmpty()}">
        <th:block th:each="product : ${products}">
            <a th:replace="~{fragments/product-card :: card}"></a>
        </th:block>
    </div>

    <div class="empty-state" th:if="${products.isEmpty()}">
        <p class="lede">Пока ни одного товара. Самое время создать первый.</p>
        <a class="button" th:href="@{/admin/products/new}">Создать товар</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
