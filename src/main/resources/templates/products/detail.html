<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${product.name} — OpenCodeProject|">Товар — OpenCodeProject</title>
    <meta name="description" th:content="${#strings.isEmpty(product.description) ? product.name : product.description}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container product-detail">
    <a class="ghost-link ghost-link--arrow" th:href="@{/products}">
        <span aria-hidden="true">←</span> Все товары
    </a>

    <p class="eyebrow eyebrow--spaced" th:text="|slug · ${product.slug}|">slug</p>
    <h1 class="display display--compact" th:text="${product.name}">Название товара</h1>

    <div class="product-detail__meta">
        <span class="product-detail__price"
              th:text="|₽ ${#numbers.formatDecimal(product.price, 1, 2)}|">₽ 0,00</span>
        <span th:text="${product.stock > 0 ? 'В наличии: ' + product.stock : 'Нет в наличии'}">В наличии</span>
        <span th:text="|Просмотров: ${product.viewCount}|">Просмотров: 0</span>
    </div>

    <p class="product-detail__body"
       th:text="${#strings.isEmpty(product.description) ? 'Описание пока не добавлено.' : product.description}">
        Описание товара
    </p>

    <div class="product-detail__actions">
        <a class="button" th:href="@{/products}">В каталог</a>
        <a class="ghost-link ghost-link--arrow"
           th:href="@{/admin/products/{id}/edit(id=${product.id})}">
            Редактировать <span aria-hidden="true">→</span>
        </a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
