<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — OpenCodeProject</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container page page--narrow">
    <a class="ghost-link ghost-link--arrow" th:href="@{/}">
        <span aria-hidden="true">←</span> На главную
    </a>

    <p class="eyebrow eyebrow--spaced">Авторизация</p>
    <h1 class="display display--compact">Создать аккаунт.</h1>

    <form class="product-form" method="post" th:action="@{/register}" th:object="${registerForm}">
        <div class="field">
            <label for="name">Имя</label>
            <input type="text" id="name" th:field="*{name}" autocomplete="name" placeholder="Ваше имя">
            <p class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email" placeholder="you@example.com">
            <p class="field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка</p>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password" placeholder="Минимум 8 символов">
            <p class="field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Ошибка</p>
        </div>

        <div class="field">
            <label for="passwordConfirm">Повторите пароль</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" autocomplete="new-password">
            <p class="field__error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">Ошибка</p>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Зарегистрироваться</button>
        </div>
    </form>

    <p class="auth-switch">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
    </p>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
