<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>

<header th:fragment="header" class="site-header container">
    <a class="brand" th:href="@{/}" aria-label="OpenCodeProject — на главную">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#8052ff"/>
                    <stop offset="100%" stop-color="#15846e"/>
                </linearGradient>
            </defs>
            <path d="M16 3 L29 27 L3 27 Z" fill="none" stroke="url(#brandGradient)" stroke-width="1.5"/>
            <path d="M16 11 L22.5 23 L9.5 23 Z" fill="none" stroke="url(#brandGradient)" stroke-width="1"/>
        </svg>
        <span class="brand__name">OpenCodeProject</span>
    </a>

    <nav class="nav" aria-label="Основная навигация">
        <a class="nav__link" th:href="@{/}">Главная</a>
        <a class="nav__link" th:href="@{/products}">Товары</a>
        <a class="nav__link" th:href="@{/admin/products}" sec:authorize="hasRole('ADMIN')">Управление</a>
    </nav>

    <div class="header-actions" sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button class="ghost-link" type="submit" style="padding:0; border:none; background:none; font:inherit; cursor:pointer;">
                Выйти
            </button>
        </form>
        <span class="header__user" sec:authentication="name">user@example.com</span>
    </div>

    <div class="header-actions" sec:authorize="!isAuthenticated()">
        <a class="ghost-link" th:href="@{/login}">Войти</a>
        <a class="button" th:href="@{/register}">Регистрация</a>
    </div>
</header>

</body>
</html>
