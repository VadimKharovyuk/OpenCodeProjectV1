<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кабинет — OpenCodeProject</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container page page--narrow">
    <p class="eyebrow eyebrow--spaced">Кабинет</p>
    <h1 class="display display--compact">
        Добро пожаловать, <span th:text="${username}">user@example.com</span>!
    </h1>

    <div class="dashboard__sections">
        <section class="dashboard__section">
            <h2 class="heading heading--sm">Каталог товаров</h2>
            <p class="lede">Смотрите актуальные позиции. Нажмите на карточку — откроется детали.</p>

            <div class="product-grid" th:if="${!products.isEmpty()}">
                <th:block th:each="product : ${products}">
                    <a th:replace="~{fragments/product-card :: card}"></a>
                </th:block>
            </div>

            <div class="empty-state" th:if="${products.isEmpty()}">
                <p class="lede">Каталог пуст.</p>
            </div>
        </section>

        <section class="dashboard__section" sec:authorize="hasRole('ADMIN')">
            <h2 class="heading heading--sm">Управление</h2>
            <p class="lede">У вас есть права администратора.</p>
            <a class="button" th:href="@{/admin/products}">Открыть панель управления</a>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
