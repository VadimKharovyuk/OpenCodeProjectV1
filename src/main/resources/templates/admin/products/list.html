<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление товарами — OpenCodeProject</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container page">
    <div class="page__head">
        <div>
            <p class="eyebrow">Управление</p>
            <h1 class="display display--compact">Товары.</h1>
            <p class="lede">Создание, редактирование и удаление товаров.</p>
        </div>
        <a class="button" th:href="@{/admin/products/new}">Новый товар</a>
    </div>

    <div class="flash" th:if="${flash}" th:text="${flash}">Товар сохранён</div>

    <div class="table-wrap" th:if="${!products.isEmpty()}">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Товар</th>
                <th>Цена</th>
                <th>Склад</th>
                <th>Просмотры</th>
                <th class="admin-table__actions-head">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td>
                    <a class="admin-table__title"
                       th:href="@{/products/{slug}(slug=${product.slug})}"
                       th:text="${product.name}">Название</a>
                    <span class="admin-table__slug" th:text="${product.slug}">slug</span>
                </td>
                <td th:text="|₽ ${#numbers.formatDecimal(product.price, 1, 2)}|">₽ 0,00</td>
                <td th:text="${product.stock}">0</td>
                <td th:text="${product.viewCount}">0</td>
                <td>
                    <div class="admin-table__actions">
                        <a class="ghost-link"
                           th:href="@{/admin/products/{id}/edit(id=${product.id})}">Изменить</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                              method="post"
                              onsubmit="return confirm('Удалить товар «' + [[${product.name}]] + '»?');">
                            <button class="link-button" type="submit">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${products.isEmpty()}">
        <p class="lede">Список пуст. Создайте первый товар — он сразу появится в каталоге.</p>
        <a class="button" th:href="@{/admin/products/new}">Создать товар</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
