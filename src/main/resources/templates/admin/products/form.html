<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Редактировать товар — OpenCodeProject' : 'Новый товар — OpenCodeProject'">
        Новый товар — OpenCodeProject
    </title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="main" class="container page page--narrow">
    <a class="ghost-link ghost-link--arrow" th:href="@{/admin/products}">
        <span aria-hidden="true">←</span> К управлению товарами
    </a>

    <p class="eyebrow eyebrow--spaced" th:text="${editing} ? 'Редактирование' : 'Создание'">Создание</p>
    <h1 class="display display--compact"
        th:text="${editing} ? 'Изменить товар.' : 'Новый товар.'">Новый товар.</h1>

    <form class="product-form" method="post" th:action="${formAction}" th:object="${productForm}">
        <input type="hidden" th:field="*{id}">

        <div class="field">
            <label for="name">Название</label>
            <input type="text" id="name" th:field="*{name}" autocomplete="off" placeholder="Например, Механическая клавиатура">
            <p class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</p>
        </div>

        <div class="field">
            <label for="slug">Slug</label>
            <input type="text" id="slug" th:field="*{slug}" autocomplete="off" placeholder="Можно оставить пустым — сгенерируем из названия">
            <p class="field__hint">Часть URL: /products/<span th:text="${#strings.isEmpty(productForm.slug) ? '…' : productForm.slug}">slug</span></p>
            <p class="field__error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">Ошибка</p>
        </div>

        <div class="field">
            <label for="description">Описание</label>
            <textarea id="description" th:field="*{description}" placeholder="Что важно знать о товаре"></textarea>
            <p class="field__error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка</p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="price">Цена, ₽</label>
                <input type="number" id="price" th:field="*{price}" min="0" step="0.01" placeholder="1999.00">
                <p class="field__error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Ошибка</p>
            </div>

            <div class="field">
                <label for="stock">На складе</label>
                <input type="number" id="stock" th:field="*{stock}" min="0" step="1">
                <p class="field__error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Ошибка</p>
            </div>
        </div>

        <div class="form-actions">
            <button class="button" type="submit" th:text="${editing} ? 'Сохранить' : 'Создать товар'">Создать товар</button>
            <a class="ghost-link" th:href="@{/admin/products}">Отмена</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
